services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zariya
      POSTGRES_USER: zariya
      POSTGRES_PASSWORD: zariya-local
    ports:
      - "5432:5432"
    volumes:
      - zariya-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zariya -d zariya"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: zariya
      DB_USER: zariya
      DB_PASSWORD: zariya-local
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  zariya-data:
