spring.application.name=zariya-approval-workflow
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zariya}}
spring.datasource.username=${DB_USER:zariya}
spring.datasource.password=${DB_PASSWORD:zariya-local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
zariya.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
zariya.notifications.email.from=${EMAIL_FROM:}
zariya.notifications.email.recipients=${EMAIL_RECIPIENTS:}
